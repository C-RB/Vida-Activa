# CI: runs the backend tests against a real Postgres (service container). Deployment is out of scope for now.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          # Same as the defaults in tests/conftest.py
          POSTGRES_USER: vida_activa
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: vida_activa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vida_activa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
